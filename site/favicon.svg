<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A signal lamp: a disc with a dark rim on light tabs, a glowing disc on dark tabs. -->
  <style>
    .halo { fill: none; }
    .rim { fill: #1a201d; }
    .lamp { fill: #1f8a4f; }
    @media (prefers-color-scheme: dark) {
      .halo { fill: #4cc38a; opacity: 0.3; }
      .rim { fill: none; }
      .lamp { fill: #4cc38a; }
    }
  </style>
  <circle class="halo" cx="16" cy="16" r="15"/>
  <circle class="rim" cx="16" cy="16" r="12"/>
  <circle class="lamp" cx="16" cy="16" r="10.5"/>
</svg>
